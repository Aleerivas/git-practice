<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <div class="container col-xl-10 col-xxl-8 px-4 py-5">

        <div class="row align-items-center g-lg-5 py-5">

            <div class="col-lg-7 text-center text-lg-start">

                <h1 class="display-4 fw-bold lh-1 text-body-emphasis mb-3">
                    Vertically centered hero sign-up form
                </h1>

                <img class="w-50" src="img/authentication-1-3 (1).png" alt="">

            </div>

            <div class="col-md-10 mx-auto col-lg-5">

                <form class="p-4 p-md-5 border rounded-3 bg-body-tertiary" method="post" action="php/login.php">

                    <div class="form-floating mb-3">
                        <input
                            type="email"
                            class="form-control"
                            id="floatingInput"
                            placeholder="name@example.com"
                            name="correo"
                        >
                        <label for="floatingInput">Correo electronico</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input
                            type="password"
                            class="form-control"
                            id="floatingPassword"
                            placeholder="Password"
                            name="password"
                        >
                        <label for="floatingPassword">Contraseña</label>
                    </div>

                    <button class="w-100 btn btn-lg btn-primary" type="submit">
                        Iniciar sesion
                    </button>

                    <hr class="my-4">

                    <small class="text-body-secondary">
                        By clicking Sign up, you agree to the terms of use.
                    </small>

                </form>

            </div>

        </div>

    </div>

    <div class="container">

        <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">

            <div class="col-md-4 d-flex align-items-center">

                <a
                    href="/"
                    class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1"
                    aria-label="Bootstrap"
                >
                    <svg class="bi" width="30" height="24" aria-hidden="true">
                        <use xlink:href="#bootstrap"></use>
                    </svg>
                </a>

                <span class="mb-3 mb-md-0 text-body-secondary">
                    © 2025 Company, Inc
                </span>

            </div>

            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">

                <li class="ms-3">
                  <a class="text-body-secondary text-decoration-none" href="#" aria-label="Redes">
                     <i class="fa-brands fa-instagram fs-4"></i>
                     <i class="fa-brands fa-facebook fs-4 ms-3"></i>
                 </a>
                </li>
            </ul>

        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
